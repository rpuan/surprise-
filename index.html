<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>砍价活动</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#222}
.top{height:54px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 16px;gap:10px}
.logo{font-size:25px;font-weight:900;color:#e02b20;letter-spacing:-1px}
.tag{font-size:12px;color:#999;border-left:1px solid #ddd;padding-left:10px}
.page{max-width:520px;margin:auto;min-height:100vh;background:#f7f7f7}
.banner{background:linear-gradient(135deg,#ff4b3e,#e5241a);color:#fff;padding:22px 20px 28px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.12)}
.banner h1{margin:0;font-size:26px}.banner p{margin:8px 0 0;font-size:14px;opacity:.92}
.card{background:#fff;margin:-14px 12px 12px;border-radius:10px;position:relative;z-index:2;padding:22px 18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.user{display:flex;align-items:center;gap:10px;font-size:14px;color:#555}
.avatar{width:40px;height:40px;border-radius:50%;background:#ffe2de;display:grid;place-items:center;font-size:22px}
.title{text-align:center;font-size:17px;font-weight:700;margin:18px 0 5px}
.sub{text-align:center;color:#999;font-size:13px}
.price{text-align:center;color:#e02b20;font-size:44px;font-weight:900;margin:12px 0 4px}
.price small{font-size:20px}
.bar{height:9px;background:#eee;border-radius:10px;overflow:hidden;margin:12px 3px}
.fill{height:100%;width:0;background:#e02b20;border-radius:10px;transition:width .5s}
.status{text-align:center;font-size:13px;color:#888;min-height:20px}
.btn{display:block;width:100%;border:0;border-radius:24px;padding:14px;background:#e02b20;color:white;
font-size:17px;font-weight:800;margin-top:14px;box-shadow:0 5px 12px rgba(224,43,32,.2);cursor:pointer}
.btn:active{transform:scale(.98)}
.notice{font-size:12px;color:#aaa;text-align:center;margin-top:15px}
.blessing{display:none;text-align:center;animation:pop .65s cubic-bezier(.2,1.5,.4,1)}
.blessing.show{display:block}
.blessing .big{font-size:58px}
.blessing h2{color:#e02b20;font-size:28px;margin:8px 0}
.blessing p{line-height:1.9;color:#555;font-size:17px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confetti i{position:absolute;top:-25px;font-style:normal;animation:fall 2.3s linear forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
</style>
</head>
<body>
<div class="page">
<header class="top">
  <div class="logo">拼多多</div>
  <div class="tag">砍价活动</div>
</header>

<section class="banner">
  <h1>帮我砍一刀</h1>
  <p>好友助力，最后一刀惊喜！</p>
</section>

<main class="card" id="card">
  <div id="game">
    <div class="user">
      <div class="avatar">🛍️</div>
      <div>你的好友邀请你来帮忙砍价</div>
    </div>
    <div class="title">限时砍价，差一点点就成功啦</div>
    <div class="sub">剩余金额</div>
    <div class="price">¥<span id="price">10.00</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">邀请好友帮忙砍价</div>
    <button class="btn" id="btn" onclick="cut()">帮TA砍一刀</button>
    <div class="notice">本页面为趣味祝福彩蛋，并非拼多多官方活动。</div>
  </div>

  <section class="blessing" id="blessing">
    <div class="big">🎉</div>
    <h2>砍价成功！</h2>
    <p style="font-size:28px;color:#e02b20;font-weight:900">¥0.01</p>
    <p>最后一刀，完美暴击！💥<br>
    你砍碎的不仅是一分钱，<br>
    <b>更是今天所有的烦恼！</b></p>
    <p>冲鸭！祝你天天好运爆棚，火力全开！🔥</p>
    <div class="notice">这是一个趣味彩蛋，非拼多多官方活动。</div>
  </section>
</main>
</div>
<div class="confetti" id="confetti"></div>

<script>
let value=10,clicks=0;
function cut(){
 if(value<=.01)return;
 clicks++;
 const drops=[2.18,1.64,2.07,1.73,1.11,0.74,0.39,0.12];
 value=Math.max(.01,value-(drops[clicks-1]||.05));
 value=Math.round(value*100)/100;
 document.getElementById('price').textContent=value.toFixed(2);
 document.getElementById('fill').style.width=(100-(value-.01)/9.99*100)+'%';
 const card=document.getElementById('card');
 card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
 if(value<=.01){
   document.getElementById('status').textContent='恭喜，最后一刀成功！';
   document.getElementById('btn').style.display='none';
   setTimeout(showBlessing,700);
 }else{
   document.getElementById('status').textContent='成功砍掉一刀，再来一次！';
 }
}
function showBlessing(){
 document.getElementById('game').style.display='none';
 document.getElementById('blessing').classList.add('show');
 const box=document.getElementById('confetti');
 const icons=['🎉','🎊','✨','❤️','🧧','⭐'];
 for(let i=0;i<55;i++){
   const e=document.createElement('i');e.textContent=icons[Math.floor(Math.random()*icons.length)];
   e.style.left=Math.random()*100+'vw';
   e.style.fontSize=(15+Math.random()*18)+'px';
   e.style.animationDelay=Math.random()*.8+'s';
   box.appendChild(e);setTimeout(()=>e.remove(),3200);
 }
}
</script>
</body>
</html>
